[project]
name = "knowledge-mcp"
version = "0.1.0"
description = "A human-readable knowledge vault with a scoped MCP maintenance interface."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.14,<2",
  "pyyaml>=6.0,<7",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/knowledge_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"docs" = "knowledge_mcp/_resources/docs"
"skills" = "knowledge_mcp/_resources/skills"

[project.scripts]
knowledge-mcp = "knowledge_mcp.server:main"

[dependency-groups]
dev = [
  "pytest>=8.0,<9",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
